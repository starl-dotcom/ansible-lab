---
- name: Laboratorio Ansible con Contenedores Docker
  hosts: docker
  gather_facts: yes
  tasks:
    - name: Mostrar el nombre del host
      ansible.builtin.debug:
        msg: "El nombre del host es: {{ inventory_hostname }}"

    - name: Mostrar el sistema operativo
      ansible.builtin.debug:
        msg: "El sistema operativo es: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Crear el directorio /tmp/ansible-demo
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: '0755'

    - name: Crear y escribir información en info.txt
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ inventory_hostname }}
          Sistema Operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}

    - name: Crear directorios mediante un loop
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje únicamente cuando el sistema operativo sea Ubuntu
      ansible.builtin.debug:
        msg: "¡Confirmado! El sistema operativo es Ubuntu en el host {{ inventory_hostname }}."
      when: ansible_distribution == 'Ubuntu'